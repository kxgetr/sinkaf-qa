name: Sinkaf QA (Manual)

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Preview URL to test'
        required: true
      baseline_url:
        description: 'Baseline URL to compare against (optional)'
        required: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  sinkaf-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Sinkaf QA
        uses: ./.github/actions/sinkaf-qa
        with:
          sinkaf-url: ${{ secrets.SINKAF_QA_URL }}
          sinkaf-token: ${{ secrets.SINKAF_QA_TOKEN }}
          preview-url: ${{ github.event.inputs.preview_url }}
          baseline-url: ${{ github.event.inputs.baseline_url }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
